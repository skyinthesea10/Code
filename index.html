<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f1117">
  <meta name="color-scheme" content="dark">
  <title>운동 타이머</title>
  <style>
    :root {
      --bg: #0f1117;
      --bg-elevated: #181b25;
      --fg: #f2f4f8;
      --fg-muted: #8b93a7;
      --accent: #4f8cff;
      --accent-strong: #2f6fe6;
      --pause: #f5b942;
      --reset: #2a2f3d;
      --ring-track: #232837;
      --done: #e5484d;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      overscroll-behavior: none;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100dvh;
      padding: max(20px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
      transition: background-color 0.4s ease;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 종료 상태: 배경이 붉게 깜빡임 */
    body.done {
      --bg: #7a1f24;
      animation: flash 1s ease-in-out infinite alternate;
    }
    @keyframes flash {
      from { background-color: #7a1f24; }
      to   { background-color: #b3282f; }
    }

    header {
      width: 100%;
      max-width: 420px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--fg-muted);
    }
    .status {
      font-size: 0.8rem;
      color: var(--fg-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--fg-muted);
    }
    body.running .status .dot { background: #3ddc84; box-shadow: 0 0 8px #3ddc84; }
    body.done .status .dot { background: #fff; }

    main {
      flex: 1;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
    }

    .ring-wrap {
      position: relative;
      width: min(86vw, 340px);
      aspect-ratio: 1 / 1;
    }
    .ring-wrap svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }
    .ring-track { fill: none; stroke: var(--ring-track); stroke-width: 10; }
    .ring-progress {
      fill: none;
      stroke: var(--accent);
      stroke-width: 10;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.25s linear, stroke 0.3s ease;
    }
    body.done .ring-progress { stroke: #fff; }

    .time-block {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    #time {
      font-family: var(--mono);
      font-size: clamp(64px, 20vw, 92px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
    }
    #label {
      font-size: 0.9rem;
      color: var(--fg-muted);
      min-height: 1.2em;
    }
    body.done #label { color: #fff; font-weight: 600; }

    .setting {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-elevated);
      border-radius: 14px;
      padding: 10px 14px;
      width: 100%;
    }
    .setting label {
      flex: 1;
      font-size: 0.95rem;
      color: var(--fg-muted);
    }
    .setting input {
      width: 84px;
      font-size: 1.25rem;
      font-family: var(--mono);
      text-align: center;
      padding: 8px 6px;
      border-radius: 10px;
      border: 1px solid #2c3242;
      background: var(--bg);
      color: var(--fg);
      outline: none;
    }
    .setting input:focus { border-color: var(--accent); }
    .setting input:disabled { opacity: 0.45; }
    .setting .unit { color: var(--fg-muted); font-size: 0.95rem; }

    .controls {
      width: 100%;
      max-width: 420px;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 12px;
    }
    button {
      font-family: inherit;
      font-size: 1.15rem;
      font-weight: 700;
      border: none;
      border-radius: 16px;
      padding: 18px 0;
      cursor: pointer;
      color: #fff;
      transition: transform 0.08s ease, background-color 0.2s ease, filter 0.2s ease;
    }
    button:active { transform: scale(0.97); filter: brightness(0.9); }
    #startPause { background: var(--accent); }
    #startPause:hover { background: var(--accent-strong); }
    body.running #startPause { background: var(--pause); color: #1a1400; }
    #reset { background: var(--reset); color: var(--fg); }
    body.done #startPause { background: #fff; color: #7a1f24; }
    body.done #reset { background: rgba(255,255,255,0.18); }

    footer {
      width: 100%;
      max-width: 420px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--fg-muted);
      margin-top: 16px;
      line-height: 1.5;
    }
    body.done footer { color: rgba(255,255,255,0.75); }

    @media (prefers-reduced-motion: reduce) {
      body.done { animation: none; background-color: #9a262c; }
    }
  </style>
</head>
<body>
  <header>
    <h1>운동 타이머</h1>
    <div class="status" aria-live="polite">
      <span class="dot"></span>
      <span id="statusText">대기 중</span>
    </div>
  </header>

  <main>
    <div class="ring-wrap" id="ringWrap" role="timer" aria-live="off">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="ring-track" cx="50" cy="50" r="45"></circle>
        <circle class="ring-progress" id="ringProgress" cx="50" cy="50" r="45"></circle>
      </svg>
      <div class="time-block">
        <div id="time">20:00</div>
        <div id="label">시작을 누르세요</div>
      </div>
    </div>

    <div class="setting">
      <label for="minutes">운동 시간</label>
      <input type="number" id="minutes" inputmode="numeric" min="1" max="180" step="1" value="20">
      <span class="unit">분</span>
    </div>
  </main>

  <div class="controls">
    <button id="startPause" type="button">시작</button>
    <button id="reset" type="button">리셋</button>
  </div>

  <footer id="hint">타이머가 돌아가는 동안 화면이 꺼지지 않도록 유지합니다.</footer>

  <script>
    (function () {
      'use strict';

      // ---------- DOM ----------
      var timeEl = document.getElementById('time');
      var labelEl = document.getElementById('label');
      var statusEl = document.getElementById('statusText');
      var hintEl = document.getElementById('hint');
      var minutesInput = document.getElementById('minutes');
      var startPauseBtn = document.getElementById('startPause');
      var resetBtn = document.getElementById('reset');
      var ring = document.getElementById('ringProgress');
      var ringWrap = document.getElementById('ringWrap');

      var CIRC = 2 * Math.PI * 45;
      ring.style.strokeDasharray = CIRC;
      ring.style.strokeDashoffset = 0;

      // ---------- 상태 ----------
      var DEFAULT_MIN = 20;
      var STORAGE_KEY = 'workout-timer-minutes';

      var totalMs = DEFAULT_MIN * 60000;   // 설정된 전체 시간
      var remainingMs = totalMs;           // 남은 시간(일시정지 시 저장)
      var endAt = 0;                       // 실행 중일 때의 종료 시각 (performance 기준)
      var state = 'idle';                  // idle | running | paused | done
      var tickId = null;
      var wakeLock = null;
      var audioCtx = null;

      // ---------- 초기값 복원 ----------
      try {
        var saved = parseInt(localStorage.getItem(STORAGE_KEY), 10);
        if (saved >= 1 && saved <= 180) {
          minutesInput.value = saved;
          totalMs = saved * 60000;
          remainingMs = totalMs;
        }
      } catch (e) { /* 저장소 사용 불가 시 기본값 유지 */ }
      render(remainingMs);

      // ---------- 렌더링 ----------
      function pad(n) { return (n < 10 ? '0' : '') + n; }

      function render(ms) {
        var totalSec = Math.max(0, Math.ceil(ms / 1000));
        var m = Math.floor(totalSec / 60);
        var s = totalSec % 60;
        var text = pad(m) + ':' + pad(s);
        if (timeEl.textContent !== text) {
          timeEl.textContent = text;
          document.title = (state === 'running' ? '▶ ' : '') + text + ' · 운동 타이머';
        }
        var ratio = totalMs > 0 ? Math.max(0, Math.min(1, ms / totalMs)) : 0;
        ring.style.strokeDashoffset = CIRC * (1 - ratio);
      }

      function setState(next) {
        state = next;
        document.body.classList.toggle('running', next === 'running');
        document.body.classList.toggle('done', next === 'done');
        minutesInput.disabled = (next === 'running' || next === 'paused');

        switch (next) {
          case 'idle':
            startPauseBtn.textContent = '시작';
            statusEl.textContent = '대기 중';
            labelEl.textContent = '시작을 누르세요';
            break;
          case 'running':
            startPauseBtn.textContent = '일시정지';
            statusEl.textContent = '진행 중';
            labelEl.textContent = '남은 시간';
            break;
          case 'paused':
            startPauseBtn.textContent = '계속';
            statusEl.textContent = '일시정지';
            labelEl.textContent = '일시정지됨';
            break;
          case 'done':
            startPauseBtn.textContent = '다시 시작';
            statusEl.textContent = '완료';
            labelEl.textContent = '운동 완료! 수고했어요';
            break;
        }
      }

      // ---------- 타이머 루프 (타임스탬프 기반, 드리프트 없음) ----------
      function tick() {
        var left = endAt - performance.now();
        if (left <= 0) {
          finish();
          return;
        }
        render(left);
      }

      function startTicking() {
        stopTicking();
        tick();
        tickId = setInterval(tick, 200);
      }

      function stopTicking() {
        if (tickId !== null) {
          clearInterval(tickId);
          tickId = null;
        }
      }

      // ---------- 동작 ----------
      function readMinutes() {
        var v = parseInt(minutesInput.value, 10);
        if (isNaN(v) || v < 1) v = 1;
        if (v > 180) v = 180;
        minutesInput.value = v;
        try { localStorage.setItem(STORAGE_KEY, String(v)); } catch (e) {}
        return v;
      }

      function start() {
        if (state === 'idle' || state === 'done') {
          totalMs = readMinutes() * 60000;
          remainingMs = totalMs;
        }
        ensureAudio();               // 사용자 제스처 안에서 오디오 컨텍스트 해제
        endAt = performance.now() + remainingMs;
        setState('running');
        startTicking();
        requestWakeLock();
      }

      function pause() {
        remainingMs = Math.max(0, endAt - performance.now());
        stopTicking();
        setState('paused');
        render(remainingMs);
        releaseWakeLock();
      }

      function reset() {
        stopTicking();
        totalMs = readMinutes() * 60000;
        remainingMs = totalMs;
        setState('idle');
        render(remainingMs);
        releaseWakeLock();
        document.title = '운동 타이머';
      }

      function finish() {
        stopTicking();
        remainingMs = 0;
        render(0);
        setState('done');
        playAlarm();
        vibrate();
        releaseWakeLock();
      }

      startPauseBtn.addEventListener('click', function () {
        if (state === 'running') pause();
        else start();
      });
      resetBtn.addEventListener('click', reset);

      // 시간 입력 변경 시 대기/완료 상태라면 즉시 반영
      minutesInput.addEventListener('change', function () {
        if (state === 'idle' || state === 'done') {
          totalMs = readMinutes() * 60000;
          remainingMs = totalMs;
          if (state === 'done') setState('idle');
          render(remainingMs);
        }
      });
      minutesInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { minutesInput.blur(); if (state === 'idle') start(); }
      });

      // 큰 숫자 영역을 탭해도 시작/일시정지
      ringWrap.addEventListener('click', function () {
        if (state === 'running') pause();
        else if (state === 'idle' || state === 'paused') start();
      });

      // 키보드: Space = 시작/일시정지, R = 리셋
      document.addEventListener('keydown', function (e) {
        if (e.target === minutesInput) return;
        if (e.code === 'Space') { e.preventDefault(); startPauseBtn.click(); }
        else if (e.key === 'r' || e.key === 'R') reset();
      });

      // ---------- Web Audio API 알림음 ----------
      function ensureAudio() {
        var Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return null;
        if (!audioCtx) audioCtx = new Ctx();
        if (audioCtx.state === 'suspended') audioCtx.resume().catch(function () {});
        return audioCtx;
      }

      function beep(ctx, startTime, freq, duration, gainValue) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, startTime);
        gain.gain.setValueAtTime(0.0001, startTime);
        gain.gain.exponentialRampToValueAtTime(gainValue, startTime + 0.02);
        gain.gain.setValueAtTime(gainValue, startTime + duration - 0.05);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
        osc.connect(gain).connect(ctx.destination);
        osc.start(startTime);
        osc.stop(startTime + duration + 0.05);
      }

      function playAlarm() {
        var ctx = ensureAudio();
        if (!ctx) return;
        var t = ctx.currentTime + 0.05;
        // 3회 반복되는 상승음 패턴 (삐-삐-삐이)
        for (var i = 0; i < 3; i++) {
          var base = t + i * 0.9;
          beep(ctx, base,        880,  0.15, 0.5);
          beep(ctx, base + 0.2,  880,  0.15, 0.5);
          beep(ctx, base + 0.4,  1320, 0.35, 0.5);
        }
      }

      function vibrate() {
        if (navigator.vibrate) {
          try { navigator.vibrate([300, 150, 300, 150, 600]); } catch (e) {}
        }
      }

      // ---------- Screen Wake Lock API ----------
      function requestWakeLock() {
        if (!('wakeLock' in navigator)) {
          hintEl.textContent = '이 브라우저는 화면 켜짐 유지를 지원하지 않습니다. 화면 자동 꺼짐을 길게 설정해 주세요.';
          return;
        }
        if (wakeLock) return;
        navigator.wakeLock.request('screen').then(function (lock) {
          wakeLock = lock;
          hintEl.textContent = '화면 켜짐 유지 중 · 탭이 다른 화면으로 가면 잠시 해제됩니다.';
          lock.addEventListener('release', function () {
            wakeLock = null;
            if (state === 'running') hintEl.textContent = '화면 켜짐 유지가 해제되었습니다. 화면으로 돌아오면 다시 켜집니다.';
          });
        }).catch(function (err) {
          wakeLock = null;
          hintEl.textContent = '화면 켜짐 유지를 사용할 수 없습니다 (' + (err && err.name ? err.name : '오류') + '). HTTPS 환경에서 열어주세요.';
        });
      }

      function releaseWakeLock() {
        if (wakeLock) {
          var lock = wakeLock;
          wakeLock = null;
          lock.release().catch(function () {});
        }
        if (state !== 'running') hintEl.textContent = '타이머가 돌아가는 동안 화면이 꺼지지 않도록 유지합니다.';
      }

      // 탭이 다시 보이면 Wake Lock 재요청 + 시간 즉시 갱신
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible' && state === 'running') {
          tick();
          requestWakeLock();
        }
      });

      // 실행 중 페이지 이탈 경고
      window.addEventListener('beforeunload', function (e) {
        if (state === 'running') { e.preventDefault(); e.returnValue = ''; }
      });
    })();
  </script>
</body>
</html>
